plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'com.gradle.plugin-publish' version '2.2.1'
}

group = 'io.certlocker'
version = trustPluginVersion

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    // Used only to bootstrap tests before the client reaches Maven Central.
    if (providers.gradleProperty('useMavenLocal').orNull == 'true') {
        mavenLocal {
            content { includeModule 'io.certlocker', 'trust-client' }
        }
    }
    mavenCentral()
}

dependencies {
    implementation "io.certlocker:trust-client:${trustClientVersion}"

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

gradlePlugin {
    website = 'https://github.com/certlocker-io/trust-gradle-plugin/'
    vcsUrl = 'https://github.com/certlocker-io/trust-gradle-plugin/'
    plugins {
        trust {
            id = 'io.certlocker.trust'
            displayName = 'Trust'
            tags.set(['certlocker', 'secrets', 'certificates'])
            compatibility {
                features {
                    configurationCache = false
                }
            }
            description = 'Exposes TrustService so a Gradle build can fetch secrets, certificates and tokens from Trust.'
            implementationClass = 'io.certlocker.trust.gradle.TrustPlugin'
        }
    }
}

publishing {
    publications.withType(MavenPublication).configureEach {
        pom {
            name = 'Trust Gradle Plugin'
            description = 'Exposes TrustService so a Gradle build can fetch secrets, certificates and tokens from Trust.'
            url = 'https://github.com/certlocker-io/trust-gradle-plugin/'
            inceptionYear = '2026'
            licenses {
                license {
                    name = 'GNU General Public License, Version 3'
                    url = 'https://www.gnu.org/licenses/gpl-3.0.html'
                    distribution = 'repo'
                }
            }
            developers {
                developer {
                    id = 'dhudson'
                    name = 'Darren Hudson'
                    url = 'https://github.com/Darren-Certlocker'
                }
            }
            scm {
                url = 'https://github.com/certlocker-io/trust-gradle-plugin/'
                connection = 'scm:git:https://github.com/certlocker-io/trust-gradle-plugin.git'
                developerConnection = 'scm:git:ssh://git@github.com/certlocker-io/trust-gradle-plugin.git'
            }
        }
    }
}

test {
    useJUnitPlatform()
}
