name: Build
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Check out pinned Java client source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: certlocker-io/trust-java-client
          ref: 9f872eef66ef1230b21e008f2a14fe4e7abdb779
          path: .ci/trust-java-client
      - name: Build Java client dependency
        working-directory: .ci/trust-java-client
        run: ./gradlew --no-daemon test publishToMavenLocal
      - run: ./gradlew --no-daemon build generatePomFileForPluginMavenPublication
