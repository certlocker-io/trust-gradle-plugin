name: Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Bootstrap the unpublished client from a reviewed, fixed revision.
      # Remove these two steps once trust-client:1.0.1 is available on Central.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: certlocker-io/trust-java-client
          ref: eb3c49c791967f17f549e07255ddcf182626e926
          path: .ci/trust-java-client
      - name: Install client for offline functional tests
        working-directory: .ci/trust-java-client
        run: ./gradlew --no-daemon publishToMavenLocal
      - run: ./gradlew --no-daemon build generatePomFileForPluginMavenPublication -PuseMavenLocal=true
